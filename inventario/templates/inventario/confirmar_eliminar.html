{% extends 'inventario/base.html' %}
{% block content %}
    <h1>Eliminar</h1>
    <p>¿Seguro que deseas eliminar <strong>{{ objeto }}</strong>?</p>
    <br>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url cancelar_url %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
